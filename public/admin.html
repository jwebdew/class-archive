<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 — CLASS.archive</title><link rel="stylesheet" href="style.css"><style>main{max-width:1000px;margin:auto;padding:60px 5%}form{display:grid;gap:12px;margin:25px 0}input,select,textarea{padding:12px;border:1px solid #b7c2b4;background:white;width:100%}textarea{min-height:100px}.admin-button{padding:12px;background:#1c2820;color:white;border:0}.items article{border-top:1px solid #ccc;padding:20px 0}.items button{margin:5px 5px 0 0;padding:8px}.tabs{display:flex;gap:10px;flex-wrap:wrap}.tabs button{padding:10px}.hint{color:#68746a;font-size:13px;line-height:1.6}</style></head><body><header class="header"><a class="logo" href="/">CLASS<span>.</span>archive</a><a href="/">사이트로 돌아가기</a></header><main><p class="eyebrow">MANAGEMENT</p><h1>Archive Admin<span style="color:#91b83d">.</span></h1><div id="login"><p>관리자 비밀번호로 로그인해 주세요.</p><form id="login-form"><input name="password" type="password" placeholder="관리자 비밀번호" required><button class="admin-button">로그인</button></form></div><div id="dashboard" hidden><div class="tabs"><button id="new-resource">자료 등록</button><button id="new-notice">공지 등록</button><button id="logout">로그아웃</button></div><div id="editor"></div><h2>자료 관리</h2><div id="resource-admin" class="items"></div><h2>공지 관리</h2><div id="notice-admin" class="items"></div></div><p id="message" role="alert"></p></main><script src="admin.js"></script></body></html>
